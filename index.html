<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Julia &amp; Joseph · Wedding Video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1f3a5f;
    --deep: #2b5179;
    --sea: #5b87b3;
    --mist: #dbe7f2;
    --foam: #f6f9fc;
    --error: #a3423a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    background: linear-gradient(160deg, #e9f1f8 0%, #c9dbec 55%, #a9c4de 100%);
    font-family: 'Lato', 'Helvetica Neue', Arial, sans-serif;
    color: var(--navy);
  }
  .card {
    width: 100%;
    max-width: 440px;
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(255, 255, 255, 0.9);
    border-radius: 6px;
    padding: 48px 40px 44px;
    text-align: center;
    box-shadow: 0 18px 50px rgba(31, 58, 95, 0.14);
    transition: max-width 0.5s ease, padding 0.5s ease;
  }
  .card.unlocked { max-width: 960px; padding: 36px 28px 32px; }
  .anchor { width: 44px; height: 44px; color: var(--deep); margin-bottom: 18px; }
  h1 {
    font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    font-weight: 400;
    font-size: clamp(2.2rem, 7vw, 2.8rem);
    line-height: 1.1;
    letter-spacing: 0.01em;
  }
  .sub {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 1.2rem;
    color: var(--sea);
    margin-top: 6px;
  }
  .rule { width: 56px; height: 1px; background: var(--sea); opacity: 0.5; margin: 24px auto; }
  p.hint { font-size: 0.95rem; font-weight: 300; line-height: 1.6; margin-bottom: 20px; }
  input {
    width: 100%;
    padding: 13px 14px;
    font: inherit;
    font-size: 1rem;
    text-align: center;
    color: var(--navy);
    background: var(--foam);
    border: 1px solid var(--mist);
    border-radius: 4px;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: var(--sea); box-shadow: 0 0 0 3px rgba(91, 135, 179, 0.2); }
  button {
    width: 100%;
    margin-top: 12px;
    padding: 13px;
    font: inherit;
    font-size: 0.95rem;
    letter-spacing: 0.06em;
    color: #fff;
    background: var(--deep);
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: var(--navy); }
  button:focus-visible { outline: 3px solid rgba(91, 135, 179, 0.5); outline-offset: 2px; }
  button:disabled { opacity: 0.7; cursor: default; }
  .error { min-height: 1.4em; margin-top: 12px; font-size: 0.88rem; color: var(--error); }
  .video-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    margin-top: 24px;
    border-radius: 4px;
    overflow: hidden;
    background: #0f1f33;
  }
  .video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  [hidden] { display: none !important; }
  @media (max-width: 480px) { .card { padding: 40px 24px 36px; } .card.unlocked { padding: 28px 14px 22px; } }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>
<body>
  <main class="card" id="card">
    <svg class="anchor" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="32" cy="10" r="5"/>
      <line x1="32" y1="15" x2="32" y2="56"/>
      <line x1="22" y1="24" x2="42" y2="24"/>
      <path d="M10 38c0 10 10 18 22 18s22-8 22-18"/>
      <polyline points="6 42 10 38 14 42"/>
      <polyline points="50 42 54 38 58 42"/>
    </svg>
    <h1>Julia &amp; Joseph</h1>
    <div class="sub">Our wedding video</div>
    <div class="rule"></div>

    <section id="gate">
      <p class="hint">Enter the password to watch.</p>
      <form id="form" autocomplete="off">
        <label for="pw" style="position:absolute;left:-9999px">Password</label>
        <input id="pw" type="password" placeholder="Password" autofocus>
        <button id="btn" type="submit">Watch video</button>
        <div class="error" id="err" role="alert"></div>
      </form>
    </section>

    <section id="player" hidden>
      <div class="video-wrap" id="videoWrap"></div>
    </section>
  </main>

<script>
  // The video ID is AES-GCM encrypted with a key derived from the password,
  // so it can't be read from the page source without the password.
  const SALT = 'JTP/DYu9jezGR1uyGyEWog==';
  const IV   = 'B4Ws5e6/dfAZuauI';
  const DATA = 'JDY0NSO6zZQ7EaigXRo09FNfPkywfoZ3NLXo';
  const ITERATIONS = 250000;

  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  async function decryptId(password) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(SALT), iterations: ITERATIONS, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
    );
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(IV) }, key, b64(DATA));
    return new TextDecoder().decode(plain);
  }

  document.getElementById('form').addEventListener('submit', async e => {
    e.preventDefault();
    const pw = document.getElementById('pw');
    const btn = document.getElementById('btn');
    const err = document.getElementById('err');
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Checking…';
    try {
      const id = await decryptId(pw.value);
      const iframe = document.createElement('iframe');
      iframe.src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(id) + '?rel=0&modestbranding=1';
      iframe.title = 'Julia & Joseph wedding video';
      iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
      iframe.allowFullscreen = true;
      document.getElementById('videoWrap').appendChild(iframe);
      document.getElementById('gate').hidden = true;
      document.getElementById('player').hidden = false;
      document.getElementById('card').classList.add('unlocked');
    } catch {
      err.textContent = 'That password didn’t match. Check it and try again.';
      pw.select();
      btn.disabled = false;
      btn.textContent = 'Watch video';
    }
  });
</script>
</body>
</html>
